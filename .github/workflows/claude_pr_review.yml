name: Claude PR review (Codex prompt)

on:
  workflow_call:
    inputs:
      prompt_override:
        type: string
        required: false
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Checkout the *target repository* (the caller repo) so Claude can see the code/diff context.
      - name: Checkout target repo
        uses: actions/checkout@v4

      # Checkout this workflow repo to read the prompt file.
      - name: Checkout workflow repo (for prompt)
        uses: actions/checkout@v4
        with:
          repository: safurrier/python-collab-template
          path: _ai_workflows

      - name: Load prompt
        id: prompt
        shell: bash
        run: |
          if [ -n "${{ inputs.prompt_override }}" ]; then
            echo "text<<EOF" >> "$GITHUB_OUTPUT"
            printf "%s\n" "${{ inputs.prompt_override }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "text<<EOF" >> "$GITHUB_OUTPUT"
            cat _ai_workflows/prompts/codex_code_review_prompt.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.text }}
          # Optional knobs (uncomment if desired):
          # use_sticky_comment: "true"
          # claude_args: "--max-turns 5"
